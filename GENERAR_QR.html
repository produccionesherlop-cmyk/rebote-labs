<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador QR - Rebote Labs (OFICIAL)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            background: #0a0f1e;
            color: white;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: #161e2e;
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        h1 {
            color: #ea580c;
            margin-bottom: 5px;
        }

        #link {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: none;
            margin: 15px 0;
            text-align: center;
            font-weight: bold;
        }

        #qrcode {
            background: white;
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>REBOTE LABS</h1>
        <p>Escanea para instalar en tu móvil</p>
        <input type="text" id="link" value="https://rebote-labs.pages.dev" oninput="updateQR()">
        <div id="qrcode"></div>
        <p style="margin-top:20px; font-size: 0.8rem; color: #94a3b8;">Sugerencia: "Añadir a pantalla de inicio"</p>
    </div>
    <script>
        let qrcode = new QRCode(document.getElementById("qrcode"), {
            text: "https://rebote-labs.pages.dev",
            width: 200, height: 200
        });
        function updateQR() { qrcode.clear(); qrcode.makeCode(document.getElementById("link").value); }
    </script>
</body>

</html>
