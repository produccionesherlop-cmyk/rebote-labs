<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="lensGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#334155;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#94a3b8;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Graphic Mark (Waves) -->
  <path d="M140 40 Q 180 10, 220 40 T 300 40" fill="none" stroke="url(#orangeGrad)" stroke-width="12" stroke-linecap="round" />
  <path d="M200 55 Q 240 25, 280 55 T 360 55" fill="none" stroke="url(#blueGrad)" stroke-width="12" stroke-linecap="round" />
  
  <!-- Text 'Reb' -->
  <text x="50" y="110" font-family="Arial, sans-serif" font-weight="bold" font-size="80" fill="white">Reb</text>
  
  <!-- Lens 'o' -->
  <circle cx="235" cy="85" r="28" fill="url(#lensGrad)" stroke="#cbd5e1" stroke-width="4" />
  <circle cx="235" cy="85" r="12" fill="#0ea5e9" opacity="0.6" />
  <circle cx="240" cy="80" r="5" fill="white" opacity="0.8" />
  
  <!-- Text 'te' -->
  <text x="275" y="110" font-family="Arial, sans-serif" font-weight="bold" font-size="80" fill="white">te</text>
  
  <!-- Text 'LABS' -->
  <text x="210" y="140" font-family="Arial, sans-serif" letter-spacing="4" font-size="18" fill="#94a3b8">LABS</text>
</svg>
